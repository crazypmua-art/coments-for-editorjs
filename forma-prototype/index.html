<div class="floatingNote noteOne">Практика<br><b>без води</b></div><div class="floatingNote noteTwo">Доступ<br><b>одразу</b></div></div></section><section class="section shell"><div class="sectionHead"><div><span class="kicker">Програми</span><h2>Оберіть свій формат.</h2></div></div><div class="productGrid">${products.map(card).join('')}</div></section><section class="splitSection shell" id="how"><div class="darkPanel"><span class="kicker light">Як це працює</span><h2>Від вибору до першого уроку — кілька хвилин.</h2><p>Без менеджерів, очікування та ручної видачі доступів.</p></div><div class="steps">${['Оберіть продукт','Оплатіть онлайн','Отримайте доступ','Почніть навчання'].map((t,i)=>`<div class="step"><span>0${i+1}</span><b>${t}</b><p>${['Знайдіть програму під вашу ціль.','Швидка та безпечна оплата.','Доступ автоматично зʼявиться в кабінеті.','Навчайтесь у своєму темпі.'][i]}</p></div>`).join('')}</div></section><section class="section shell"><div class="quoteGrid"><div class="quoteBig">“Найкраще навчання — те, після якого ви починаєте <em>діяти</em>.”</div><div class="review"><div class="stars">★★★★★</div><p>«Все дуже структуровано. Я пройшла програму за два тижні і нарешті склала для себе зрозумілий план.»</p><span>— Марина, учасниця програми</span></div></div></section><section class="author shell"><div class="authorPhoto imgHero"></div><div class="authorText"><span class="kicker">Про автора</span><h2>Експертність, яка спирається на практику.</h2><p>Тут буде коротка історія автора, досвід, досягнення та власний підхід до навчання. Після розмови з клієнтом просто замінимо контент.</p><div class="miniStats"><b>10+ років досвіду</b><b>2 000+ клієнтів</b><b>5 програм</b></div></div></section><section class="section shell"><span class="kicker">FAQ</span><h2>Коротко про головне.</h2><div class="faqList">${['Як я отримаю доступ після оплати?','Скільки часу доступні матеріали?','Чи можна дивитися з телефону?','Чи є повернення коштів?'].map(q=>`<details><summary>${q}<span>+</span></summary><p>Демонстраційна відповідь. Після узгодження замінимо на реальні умови.</p></details>`).join('')}</div></section><section class="cta shell"><span class="kicker light">Готові почати?</span><h2>Оберіть програму, яка відповідає вашій цілі.</h2><a class="lightBtn" href="#product">Переглянути продукти</a></section></main>${footer()}`};function product(){const p=products[1];return `${header()}<main><section class="productHero shell"><div><span class="kicker">${p.eyebrow}</span><h1>${p.title}</h1><p>${p.desc}</p><div class="heroActions"><a class="solidBtn" href="#checkout">Придбати — ${money(p.price)}</a><span class="safeNote">Доступ одразу після оплати</span></div></div><div class="courseCover ${p.img}"><span>FORMA / 02</span><b>${p.title}</b><em>${p.format}</em></div></section><section class="section shell"><div class="threeCols"><div><h3>Для кого</h3><p>Для тих, хто хоче системно розібратися в темі.</p></div><div><h3>Що зміниться</h3><p>Зʼявиться чітка система дій.</p></div><div><h3>Формат</h3><p>${p.format}. Відео, матеріали та чеклісти.</p></div></div></section><section class="priceSection shell"><div><span class="kicker">Повний доступ</span><h2>${p.title}</h2><p>Одноразова оплата. Матеріали відкриваються автоматично.</p></div><div class="priceCard"><span>Вартість</span><strong>${money(p.price)}</strong><a class="solidBtn" href="#checkout">Придбати</a></div></section></main>${footer()}`};function checkout(){const p=products[1];return `${header()}<main><section class="checkout shell"><div><span class="kicker">Оформлення</span><h1>Ще один крок.</h1><p>Заповніть контакти — після оплати доступ буде створений автоматично.</p></div><form class="checkoutForm" onsubmit="event.preventDefault();location.hash='account'"><label>Імʼя<input required placeholder="Ваше імʼя"></label><label>Email<input required type="email" placeholder="you@email.com"></label><label>Телефон<input placeholder="+380"></label><div class="total"><span>До сплати</span><strong>${money(p.price)}</strong></div><button class="solidBtn full">Перейти до оплати</button></form></section></main>${footer()}`};function account(){return `${header()}<main><section class="account shell"><aside class="accountSide"><div class="avatar">OL</div><b>Олександр</b><small>student@example.com</small><nav><a class="active">Мої продукти</a><a>Профіль</a><a>Налаштування</a></nav><a href="#home">Вийти</a></aside><div><span class="kicker">Особистий кабінет</span><h1>Добрий вечір, Олександре 👋</h1><div class="learningGrid">${products.slice(0,2).map((p,i)=>`<div class="learningCard"><div class="learningCover ${p.img}"><span>${p.title}</span></div><div class="learningBody"><h3>${p.title}</h3><div class="progressBar"><i style="width:${i?29:68}%"></i></div><small>${i?'29%':'68%'}</small><br><a class="solidBtn small" href="#learn">Продовжити</a></div></div>`).join('')}</div></div></section></main>${footer()}`};function learn(){return `<div class="learnPage"><aside class="lessonSide"><a class="brand" href="#home"><span class="brandMark">F</span><span>FORMA</span></a><a href="#account">← До кабінету</a><h3>Практика</h3><p>01 · Фундамент</p><p>02 · Система</p><p>03 · Практика</p></aside><main class="lessonContent"><span class="kicker">Модуль 01 · Урок 03</span><h1>Як побудувати робочу систему</h1><p>У цьому уроці розбираємо базовий фреймворк і збираємо його під вашу ситуацію.</p><div class="videoMock"><button>▶</button></div><h2>Про урок</h2><p>Тут може бути текст уроку, матеріали, файли, завдання та посилання.</p></main></div>`}function render(){const r=(location.hash||'#home').slice(1);document.getElementById('app').innerHTML=({home,product,checkout,account,learn}[r]||home)();document.querySelectorAll('.previewNav button').forEach(b=>b.classList.toggle('active',b.dataset.route===r));window.scrollTo(0,0)}document.querySelectorAll('.previewNav button').forEach(b=>b.onclick=()=>location.hash=b.dataset.route);window.onhashchange=render;render();</script></body></html>
